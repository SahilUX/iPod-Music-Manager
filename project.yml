name: iPodMusicManager
options:
  bundleIdPrefix: com.sahil
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

targets:
  iPodMusicManager:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: iPodMusicManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sahil.iPodMusicManager
        PRODUCT_NAME: iPod Music Manager
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_REQUIRED: "YES"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_HARDENED_RUNTIME: "YES"
        INFOPLIST_FILE: iPodMusicManager/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIcon-ClickWheel
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    info:
      path: iPodMusicManager/Info.plist
      properties:
        CFBundleDisplayName: iPod Music Manager
        CFBundleShortVersionString: "1.5"
        CFBundleVersion: "15"
        NSPrincipalClass: NSApplication
        NSAppleEventsUsageDescription: "iPod Music Manager controls Apple Music to import and organize tracks."
        NSAppleScriptEnabled: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        LSMultipleInstancesProhibited: true
    entitlements:
      path: iPodMusicManager/iPodMusicManager.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.network.client: true
